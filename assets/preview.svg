<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Junction plugin preview with sample window and tmux room choices">
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112b38"/>
      <stop offset="0.48" stop-color="#102134"/>
      <stop offset="1" stop-color="#1d2439"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#477f83" stop-opacity=".48"/>
      <stop offset="1" stop-color="#477f83" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91e6d1"/>
      <stop offset="1" stop-color="#76a8e8"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="28" stdDeviation="35" flood-color="#020810" flood-opacity=".7"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#desktop)"/>
  <circle cx="790" cy="450" r="610" fill="url(#glow)"/>
  <path d="M0 730c345-175 485-600 893-626 224-15 380 91 707-72" fill="none" stroke="#8ad5ca" stroke-opacity=".08" stroke-width="2"/>
  <path d="M0 826c377-185 531-539 861-571 308-30 459 86 739-3" fill="none" stroke="#8ad5ca" stroke-opacity=".07" stroke-width="2"/>
  <text x="83" y="91" fill="#a9ded2" font-family="sans-serif" font-size="17" letter-spacing="5">RIFTLAB / DESKTOP TOOLS</text>
  <text x="83" y="816" fill="#effaf5" font-family="sans-serif" font-size="48" font-weight="700">Every window. Every room. One jump.</text>
  <text x="84" y="851" fill="#9eafb8" font-family="sans-serif" font-size="19">Built by Nox, Chief Shipper at RiftLab</text>

  <g filter="url(#shadow)">
    <rect x="430" y="125" width="740" height="628" rx="18" fill="#0e1b28" stroke="#5a8290" stroke-width="2"/>
    <rect x="459" y="154" width="55" height="55" rx="12" fill="#142b3b" stroke="#70a49f"/>
    <path d="M472 168 486 181 501 181M472 196l14-15m0-14v14" fill="none" stroke="url(#line)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="486" cy="181" r="4.2" fill="#e6f6ed"/>
    <text x="532" y="182" fill="#eaf8f2" font-family="sans-serif" font-size="29" font-weight="700">Junction</text>
    <text x="533" y="203" fill="#84a4ae" font-family="sans-serif" font-size="12" letter-spacing="2.4">WINDOWS  /  ROOMS</text>
    <rect x="459" y="231" width="682" height="55" rx="9" fill="#142635" stroke="#547481"/>
    <text x="479" y="267" fill="#91aeb4" font-family="sans-serif" font-size="18">Type to jump anywhere…</text>

    <rect x="459" y="306" width="682" height="69" rx="9" fill="#2b475b"/>
    <rect x="472" y="320" width="39" height="39" rx="7" fill="#345c6c"/>
    <text x="482" y="346" fill="#d7f3e8" font-family="sans-serif" font-size="20">▣</text>
    <text x="528" y="334" fill="#f5fbf7" font-family="sans-serif" font-size="19" font-weight="600">Ghostty · Project notes</text>
    <text x="528" y="357" fill="#a9c9cb" font-family="sans-serif" font-size="14">2 Build · recent window</text>

    <g fill="#e0efec" font-family="sans-serif" font-size="19">
      <text x="482" y="411">⌘</text><text x="528" y="410">Work</text>
      <text x="482" y="477">⌘</text><text x="528" y="476">Research</text>
      <text x="482" y="543">▣</text><text x="528" y="542">Browser · Omarchy docs</text>
      <text x="482" y="609">▣</text><text x="528" y="608">Mail · Inbox</text>
    </g>
    <g fill="#829fa9" font-family="sans-serif" font-size="14">
      <text x="528" y="431">tmux session</text>
      <text x="528" y="497">tmux session</text>
      <text x="528" y="563">1 Main</text>
      <text x="528" y="629">3 Comms</text>
    </g>
    <path d="M459 676h682" stroke="#43616f"/>
    <text x="459" y="711" fill="#8caab1" font-family="sans-serif" font-size="13" letter-spacing="1.1">↑↓ MOVE     ↵ JUMP     ESC CLOSE</text>
    <text x="1014" y="711" fill="#8caab1" font-family="sans-serif" font-size="13" letter-spacing="1.1">RIFTLAB / NOX</text>
  </g>
</svg>
